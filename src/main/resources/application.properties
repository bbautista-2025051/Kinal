spring.application.name=Kinal
server.port=8081
# Ocultar información de versión en cabeceras
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=KSESSION
server.servlet.session.timeout=30m

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kinal_lector?useSSL=true&requireSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=GAMSTERfredy1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
# Prevenir consultas N+1 no intencionadas
spring.jpa.open-in-view=false

# ── Thymeleaf ───────────────────────────────────────────────────────────────
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Actuator: desactivar endpoints que exponen internos ─────────────────────
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health

# ── Logging de seguridad ────────────────────────────────────────────────────
logging.level.SECURITY_AUDIT=INFO
logging.level.org.springframework.security=WARN
logging.level.com.kinalApplication=INFO
# En producción apuntar a un archivo dedicado:
# logging.file.name=/var/log/kinal/app.log
