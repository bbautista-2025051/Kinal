<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Fundación Kinal</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<div class="registro-wrap">
    <div class="registro-card">
        <div class="registro-icon"><i class="fas fa-user-plus"></i></div>
        <h2>Crear cuenta</h2>
        <p class="subtitle">Regístrate para acceder a las lecturas técnicas de tu carrera.</p>

        <form th:action="@{/registro}" th:object="${registroDTO}" method="post">
            <!-- Token CSRF explícito — necesario en Spring Security 6 con CookieCsrfTokenRepository -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label for="nombreCompleto">Nombre completo</label>
                <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" placeholder="Ej. María García López" required>
                <div th:if="${#fields.hasErrors('nombreCompleto')}" class="field-error" th:errors="*{nombreCompleto}"></div>
            </div>
            <div class="field">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{email}" placeholder="ejemplo@kinal.edu.gt" required>
                <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Mín. 8 caracteres, mayúscula, minúscula y número" required>
                <div th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></div>
            </div>
            <div class="field">
                <label for="carreraId">Carrera técnica</label>
                <div class="select-wrap">
                    <select id="carreraId" th:field="*{carreraId}" required>
                        <option value="">— Selecciona tu carrera —</option>
                        <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                </div>
                <div th:if="${#fields.hasErrors('carreraId')}" class="field-error" th:errors="*{carreraId}"></div>
            </div>

            <button type="submit" class="btn-registro">Crear mi cuenta <i class="fas fa-arrow-right ms-1"></i></button>
        </form>

        <div class="divider"></div>
        <p class="login-link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </div>
</div>

</body>
</html>
