<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Iniciar Sesión · Kinal</title>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.2/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/kinal.css}"/>
</head>
<body>

<div class="k-auth-layout">
    <div class="k-auth-left">
        <div class="k-glow k-glow-indigo" style="width:400px;height:400px;top:-50px;left:-60px;opacity:0.3;"></div>

        <div>
            <img src="https://static.wixstatic.com/media/128120_32e25aed1e3b488f9f2e834a59aef168~mv2.png/v1/fill/w_313,h_114,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Recurso%208_3x-8%20(3).png"
                 alt="Kinal" style="height:50px; filter: brightness(0) invert(1);">

            <h1 class="k-display">
                Lee.<br>Comprende.<br><span style="color:var(--kinal-gold)">Crece.</span>
            </h1>

            <p class="k-subtext">
                Plataforma especializada para el desarrollo de habilidades de comprensión lectora técnica.
            </p>

            <div style="display:flex; gap:3rem; margin-top:3rem;">
                <div style="border-left: 2px solid var(--kinal-gold); padding-left: 1rem;">
                    <div style="font-size: 1.5rem; font-weight: 800;">+200</div>
                    <div style="font-size: 0.7rem; text-transform: uppercase; opacity: 0.6;">Lecturas</div>
                </div>
                <div style="border-left: 2px solid var(--kinal-gold); padding-left: 1rem;">
                    <div style="font-size: 1.5rem; font-weight: 800;">100%</div>
                    <div style="font-size: 0.7rem; text-transform: uppercase; opacity: 0.6;">Digital</div>
                </div>
            </div>
        </div>

        <div class="k-books" style="opacity: 0.1;">
            <div class="k-book"></div><div class="k-book"></div><div class="k-book"></div>
        </div>
    </div>

    <div class="k-auth-right">
        <div class="k-auth-form-box fade-up">
            <div style="text-align:center; margin-bottom:2rem;">
                <div style="width:48px;height:48px;background:var(--kinal-blue);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;">
                    <i class="fa fa-user-shield" style="color:white;"></i>
                </div>
                <h2 class="k-heading">Acceso Estudiantes</h2>
                <p class="k-subtext">Ingresa tus datos para continuar</p>
            </div>

            <form th:action="@{/login}" method="post" id="loginForm">
                <div class="k-form-group">
                    <label class="k-label">Correo electrónico</label>
                    <input type="email" name="username" class="k-input" placeholder="ejemplo@kinal.edu.gt" required/>
                </div>

                <div class="k-form-group">
                    <label class="k-label">Contraseña</label>
                    <div style="position:relative">
                        <input type="password" id="password" name="password" class="k-input" placeholder="••••••••" required/>
                        <button type="button" id="togglePwd" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer;">
                            <i class="fa fa-eye" id="eyeIcon" style="color:var(--k-caption)"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="k-btn k-btn-primary k-btn-lg" style="width:100%; justify-content:center;">
                    Iniciar Sesión <i class="fa fa-arrow-right"></i>
                </button>
            </form>

            <p style="text-align:center; margin-top:2rem; font-size:0.9rem;">
                ¿Eres nuevo? <a href="/registro" style="font-weight:700;">Crea una cuenta</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('togglePwd').addEventListener('click', function() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });
</script>
</body>
</html>
