<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="page-hero">
    <div class="container-custom">
        <p class="eyebrow"><i class="fas fa-graduation-cap me-1"></i> Oferta académica</p>
        <h1>Carreras Técnicas</h1>
        <p>Selecciona tu especialidad y accede a lecturas y tests diseñados para tu carrera.</p>
    </div>
</div>

<div class="carreras-grid">
    <div class="container-custom">
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="c, iterStat : ${carreras}">
                <div class="carrera-card">
                    <div class="carrera-num" th:text="'0' + ${iterStat.index + 1}"></div>
                    <div class="carrera-icon-wrap">
                        <i th:if="${c.nombre.contains('Informática')}" class="fas fa-laptop-code"></i>
                        <i th:if="${c.nombre.contains('Electrónica')}" class="fas fa-microchip"></i>
                        <i th:if="${c.nombre.contains('Dibujo')}" class="fas fa-drafting-compass"></i>
                        <i th:unless="${c.nombre.contains('Informática') or c.nombre.contains('Electrónica') or c.nombre.contains('Dibujo')}" class="fas fa-tools"></i>
                    </div>
                    <h3 th:text="${c.nombre}"></h3>
                    <p th:text="${c.descripcion}"></p>
                    <a th:href="@{/carreras/{id}/lecturas (id=${c.id})}" class="btn-carrera">
                        Ver lecturas <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
