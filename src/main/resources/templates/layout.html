<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Kinal - Comprensión Lectora Técnica</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/6.5.2/css/all.min.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap" rel="stylesheet">
    <!-- CSS general único -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-kinal" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="https://static.wixstatic.com/media/128120_d3a7d361b5a1420da3739f66af5a13ad~mv2.png/v1/fill/w_320,h_117,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/KINAL%20LETRAS%20(2).png" alt="Fundación Kinal">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav gap-1 align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/carreras}"><i class="fas fa-graduation-cap"></i> Carreras</a>
                </li>
                <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                    <a class="nav-link" th:href="@{/mis-notas}"><i class="fas fa-chart-bar"></i> Mis Notas</a>
                </li>
                <li class="nav-item ms-2" th:if="${#authorization.expression('isAuthenticated()')}">
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-nav-logout"><i class="fas fa-sign-out-alt me-1"></i> Salir</button>
                    </form>
                </li>
                <li class="nav-item ms-2" th:unless="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}" class="btn-nav-logout"><i class="fas fa-sign-in-alt me-1"></i> Ingresar</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer class="footer-kinal" th:fragment="footer">
    <div class="container">
        <div class="divider"></div>
        <p>© 2026 Fundación Kinal &mdash; Todos los derechos reservados</p>
        <div class="mt-2 d-flex justify-content-center gap-3">
            <a href="#">English</a>
            <a href="#">Español</a>
        </div>
    </div>
</footer>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
