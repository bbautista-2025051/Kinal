spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.us-east-1.prod.aws.tidbcloud.com:4000/kinal_lector?ssl-mode=VERIFY_IDENTITY&useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3}
